<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Module Diagnostic</title>
<style>
body { font-family: monospace; padding: 20px; background: #0f172a; color: #38bdf8; }
.ok { color: #10b981; }
.fail { color: #ef4444; }
#log { white-space: pre-wrap; line-height: 1.8; }
</style>
</head>
<body>
<h2>Module Import Diagnostic</h2>
<div id="log"></div>
<script type="module">
const log = document.getElementById('log');
function ok(msg) { log.innerHTML += '<span class="ok">OK ' + msg + '</span>\n'; }
function fail(msg, err) { log.innerHTML += '<span class="fail">FAIL ' + msg + ': ' + err + '</span>\n'; }

const modules = [
  ['config/env.js', () => import('./src/config/env.js')],
  ['config/plans.js', () => import('./src/config/plans.js')],
  ['mock-data.js', () => import('./src/mock-data.js')],
  ['components/canvas-signature.js', () => import('./src/components/canvas-signature.js')],
  ['services/auth-service.js', () => import('./src/services/auth-service.js')],
  ['services/subscription-service.js', () => import('./src/services/subscription-service.js')],
  ['services/billing-service.js', () => import('./src/services/billing-service.js')],
  ['services/db-service.js', () => import('./src/services/db-service.js')],
  ['services/tenant-data-service.js', () => import('./src/services/tenant-data-service.js')],
  ['services/pdf-generator-service.js', () => import('./src/services/pdf-generator-service.js')],
  ['views/auth-pages.js', () => import('./src/views/auth-pages.js')],
  ['views/landing-page.js', () => import('./src/views/landing-page.js')],
  ['views/subscription-page.js', () => import('./src/views/subscription-page.js')],
  ['views/database-config-view.js', () => import('./src/views/database-config-view.js')],
  ['views/new-service-wizard.js', () => import('./src/views/new-service-wizard.js')],
  ['views/service-detail-view.js', () => import('./src/views/service-detail-view.js')],
  ['app.js (FULL)', () => import('./src/app.js')],
];

(async () => {
  for (const [name, loader] of modules) {
    try {
      await loader();
      ok(name);
    } catch (err) {
      fail(name, err.message || err);
    }
  }
  log.innerHTML += '\n=== DIAGNOSTIC COMPLETE ===\n';
})();
</script>
</body>
</html>
