<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OS Cloud - Gestão do Ciclo de Vida do Ativo Patrimonial</title>

  <!-- STEP 1: Force unregister ALL old Service Workers and purge ALL caches BEFORE anything loads -->
  <script>
    (function() {
      // Unregister all service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(reg) {
            reg.unregister();
          });
        });
      }
      // Delete all caches
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) {
            caches.delete(name);
          });
        });
      }
    })();
  </script>

  <!-- PWA Manifest & Web Icons -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">

  <!-- Fonts & Local Lucide Icons (Zero External CDN Dependency) -->
  <link rel="stylesheet" href="src/assets/styles/main.css?v=2.2.4">
  <script src="src/assets/js/lucide.min.js?v=2.2.4"></script>

  <!-- Live On-Screen Debug HUD & Error Boundary -->
  <script>
    (function() {
      window._debugLogs = [];
      function addDebugLog(type, msg) {
        var entry = '[' + new Date().toLocaleTimeString() + '] [' + type.toUpperCase() + '] ' + msg;
        window._debugLogs.push(entry);
        var hudContent = document.getElementById('debug-hud-logs');
        if (hudContent) {
          var line = document.createElement('div');
          line.style.color = type === 'error' ? '#f87171' : type === 'warn' ? '#fbbf24' : '#38bdf8';
          line.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
          line.style.padding = '4px 0';
          line.textContent = entry;
          hudContent.appendChild(line);
          hudContent.scrollTop = hudContent.scrollHeight;
        }
        var countEl = document.getElementById('debug-hud-count');
        if (countEl && type === 'error') {
          window._errCount = (window._errCount || 0) + 1;
          countEl.textContent = window._errCount + ' erros';
          countEl.style.background = '#ef4444';
        }
      }

      var origLog = console.log, origWarn = console.warn, origErr = console.error;
      console.log = function() { origLog.apply(console, arguments); addDebugLog('log', Array.from(arguments).join(' ')); };
      console.warn = function() { origWarn.apply(console, arguments); addDebugLog('warn', Array.from(arguments).join(' ')); };
      console.error = function() { origErr.apply(console, arguments); addDebugLog('error', Array.from(arguments).join(' ')); };

      window.addEventListener('error', function(e) {
        addDebugLog('error', (e.message || 'Erro') + ' em ' + (e.filename || 'script') + ':' + e.lineno);
        var c = document.getElementById('public-view-container');
        if (c && !window._err) {
          window._err = true;
          c.style.display = 'block';
          c.innerHTML = '<div style="max-width:500px;margin:40px auto;padding:24px;background:#fff;border:2px solid #fecaca;border-radius:16px;text-align:center">' +
            '<h3 style="color:#991b1b;margin-bottom:12px">Erro de Execução</h3>' +
            '<p style="font-size:0.85rem;color:#64748b;background:#fef2f2;padding:10px;border-radius:8px;font-family:monospace;word-break:break-all;margin-bottom:16px">' + (e.message || 'Erro desconhecido') + '</p>' +
            '<button onclick="if(confirm(\'Limpar dados locais e recarregar?\')){localStorage.clear();location.reload()}" style="padding:12px 24px;background:#0f172a;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer">Limpar Cache e Recarregar</button>' +
            '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        addDebugLog('error', 'Promise Rejeitada: ' + (e.reason ? e.reason.message || e.reason : 'Desconhecida'));
      });
    })();
  </script>
</head>
<body>

  <div id="app-root">
    <div id="trial-banner-container"></div>

    <header class="topbar">
      <div class="brand-container" id="btn-go-home" title="Ir para a Tela Inicial">
        <div id="brand-logo-wrapper" style="display: flex; align-items: center; gap: 10px;">
          <div class="brand-icon" id="brand-default-icon">
            <i data-lucide="cloud-cog"></i>
          </div>
          <img id="brand-custom-logo" style="display: none; height: 38px; max-width: 160px; object-fit: contain; border-radius: 6px;" alt="Logotipo">
        </div>
        <div>
          <div class="brand-title">OS Cloud</div>
          <div style="font-size: 0.8rem; color: var(--text-muted);" id="header-company-name">Plataforma de Manutenção & Ativos</div>
        </div>
      </div>
      <div class="topbar-right" id="header-topbar-right"></div>
    </header>

    <main class="main-container">
      <div id="public-view-container"></div>

      <div id="private-view-container" style="display: none;">
        <div class="kpi-row" id="kpi-summary-row">
          <div class="kpi-card">
            <div class="kpi-label">FATURAMENTO MÊS</div>
            <div class="kpi-value" style="color: #10b981;">R$ 0.00</div>
            <div class="kpi-sub">Serviços Registrados</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">CLIENTES & ATIVOS</div>
            <div class="kpi-value" style="color: #6366f1;">0</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">equipamentos</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">EQUIPE EM CAMPO</div>
            <div class="kpi-value">1</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">técnicos ativos</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">ASSINATURA SAAS</div>
            <div class="kpi-value" style="color: #3b82f6;">30 dias</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">período gratuito</div>
          </div>
        </div>

        <div class="navigation-bar" id="navigation-bar" style="display: none;">
          <button class="btn-back" id="btn-nav-back">
            <i data-lucide="arrow-left"></i>
            <span>Voltar ao Nível Anterior</span>
          </button>
          <div class="breadcrumbs" id="breadcrumb-trail">
            <span class="active">Painel Principal</span>
          </div>
        </div>

        <div class="section-heading" id="section-heading">MÓDULOS OPERACIONAIS</div>
        <div class="block-grid" id="block-grid-container"></div>
        <div id="content-view-container" style="display: none;"></div>
      </div>
    </main>
  </div>

  <!-- Register the new pass-through Service Worker (replaces old caching one) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=2.4.0').catch(function() {});
    }
  </script>

  <!-- Application Logic -->
  <script type="module" src="src/app.js?v=2.4.0"></script>

</body>
</html>
